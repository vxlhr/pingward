name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies — known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Worker — typecheck
        run: npm run typecheck -w worker
      - name: Worker — tests
        run: npm test -w worker
      - name: Frontend — lint
        run: npm run lint -w frontend
      - name: Frontend — static build
        run: npm run build
      - name: Worker + assets — bundle check (no upload)
        run: npx wrangler deploy --dry-run
      - name: Smoke test — boot the Worker and call it
        run: |
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --port 8787 --var ALLOW_UNAUTHENTICATED_WRITES:true > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health; then
              curl -sf http://localhost:8787/ | grep -q '<title>PingWard</title>'
              curl -sf http://localhost:8787/status | grep -q '<title>Status · PingWard</title>'
              exit 0
            fi
            sleep 2
          done
          cat wrangler-dev.log
          exit 1

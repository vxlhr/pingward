name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Worker — typecheck
        run: npm run typecheck -w worker
      - name: Worker — tests
        run: npm test -w worker
      - name: Frontend — lint
        run: npm run lint -w frontend
      - name: Frontend — static build
        run: npm run build
      - name: Worker + assets — bundle check (no upload)
        run: npx wrangler deploy --dry-run
        working-directory: worker

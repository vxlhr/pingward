name: Docker

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the publish job below may write packages.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t pingward:test .

      - name: Smoke test — run the container and call it
        run: |
          docker run -d --name pingward -p 127.0.0.1:8787:8787 -e API_TOKEN=ci-smoke-test-token-0123 pingward:test
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health; then
              curl -sf http://localhost:8787/ | grep -q '<title>PingWard</title>'
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/api/monitors \
                -H 'Content-Type: application/json' -d '{"name":"x","url":"https://example.com"}')
              test "$code" = 401   # writes without the token are refused
              # No secrets or env files may end up in the app (dependencies aside).
              leaked=$(docker run --rm --entrypoint sh pingward:test -c 'find /app -path /app/node_modules -prune -o \( -name ".dev.vars*" -o -name ".env*" -o -name "*.secrets.json" \) ! -name "*.example" -print')
              if [ -n "$leaked" ]; then echo "Secret/env files in the image: $leaked"; exit 1; fi
              exit 0
            fi
            sleep 2
          done
          docker logs pingward
          exit 1

      # Hand the tested image to the publish job, so exactly what passed is what ships.
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save pingward:test | gzip > pingward-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pingward-image
          path: pingward-image.tar.gz
          retention-days: 1

  # Only after the smoke test passed, and only for main.
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pingward-image
      - name: Publish to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gunzip -c pingward-image.tar.gz | docker load
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag pingward:test "$IMAGE:latest"
          docker tag pingward:test "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker logout ghcr.io

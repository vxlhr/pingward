name = "pingward"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The dashboard (Next.js static export) is served by this same Worker.
# Only /api/* runs Worker code; everything else is a static asset from the CDN.
# (/__scheduled lets `wrangler dev --test-scheduled` trigger the cron locally;
#  in production it just falls through to the 404 page.)
[assets]
directory = "../frontend/out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/__scheduled"]

# Runs every minute; the code decides which monitors are due.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pingward-db"
# Paste the ID printed by `npx wrangler d1 create pingward-db`.
database_id = "f8a3c259-a327-4535-baa5-884e07d75c61"

# Per-IP limit for /api/* : 100 requests per minute (protects the D1 read quota).
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
# Extra origins allowed to call the API cross-origin (comma-separated).
# Empty in production: the dashboard is same-origin. `npm run dev` adds http://localhost:3000.
ALLOWED_ORIGINS = ""
# "true" = the dashboard and read endpoints also need the API token (private mode).
READ_PROTECTED = "false"

# Secrets (never committed):
#   local:      worker/.dev.vars  ->  API_TOKEN=...
#   production: npx wrangler secret put API_TOKEN
# Without API_TOKEN, production refuses every write (fail closed).

# Workers Logs (free: 200k events/day, 3-day retention). Only our own console output is kept:
# invocation logs (full request metadata, incl. headers such as Authorization) are switched off.
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t pingward:test .

      - name: Smoke test — run the container and call it
        run: |
          docker run -d --name pingward -p 8787:8787 -e API_TOKEN=ci-smoke-test-token-0123 pingward:test
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health; then
              curl -sf http://localhost:8787/ | grep -q '<title>PingWard</title>'
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/api/monitors \
                -H 'Content-Type: application/json' -d '{"name":"x","url":"https://example.com"}')
              test "$code" = 401   # writes without the token are refused
              exit 0
            fi
            sleep 2
          done
          docker logs pingward
          exit 1

      # Only after the smoke test passed, and only for main.
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag pingward:test "$IMAGE:latest"
          docker tag pingward:test "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

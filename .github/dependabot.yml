# Weekly update PRs for npm packages, the pinned GitHub Actions and the Docker base image.
# Major versions are skipped here (they need code changes and are done by hand); security
# fixes still arrive right away through Dependabot security updates, majors included.
# Every PR has to pass CI before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line the project targets (.node-version); bump it by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
